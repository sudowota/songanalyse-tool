<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="gehaeuse" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6a4a"/>
      <stop offset="0.55" stop-color="#e8321c"/>
      <stop offset="1" stop-color="#a81a0c"/>
    </linearGradient>
    <linearGradient id="glanz" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.45"/>
      <stop offset="0.35" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="scheibe" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.3" stop-color="#ff8a66" stop-opacity="0.55"/>
      <stop offset="0.75" stop-color="#7a1a0c" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#3a0a04" stop-opacity="0.8"/>
    </radialGradient>
    <linearGradient id="verschluss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef0f2"/>
      <stop offset="0.5" stop-color="#a9aeb5"/>
      <stop offset="1" stop-color="#6e737a"/>
    </linearGradient>
  </defs>

  <!-- Gehäuse: füllt die ganze Fläche, ohne Rand -->
  <rect x="0" y="0" width="900" height="900" fill="url(#gehaeuse)"/>
  <rect x="0" y="0" width="900" height="900" fill="url(#glanz)"/>

  <!-- Fenster-Linien auf dem Gehäuse -->
  <rect x="36" y="36" width="828" height="828" rx="10" fill="none" stroke="#fff" stroke-opacity="0.22" stroke-width="3"/>

  <!-- Disc -->
  <circle cx="380" cy="450" r="340" fill="url(#scheibe)"/>
  <circle cx="380" cy="450" r="300" fill="none" stroke="#ffb49a" stroke-opacity="0.35" stroke-width="6"/>
  <circle cx="380" cy="450" r="250" fill="none" stroke="#000" stroke-opacity="0.2" stroke-width="10"/>
  <circle cx="380" cy="450" r="190" fill="none" stroke="#ffd2bd" stroke-opacity="0.18" stroke-width="5"/>

  <!-- Nabe -->
  <circle cx="380" cy="450" r="130" fill="#1a0503" fill-opacity="0.8"/>
  <circle cx="380" cy="450" r="108" fill="#ff7a55" fill-opacity="0.75"/>
  <circle cx="380" cy="450" r="62" fill="#ffb08a" fill-opacity="0.9"/>
  <circle cx="380" cy="450" r="16" fill="#ff9c70"/>

  <!-- Verschluss -->
  <rect x="560" y="265" width="300" height="370" rx="8" fill="url(#verschluss)" stroke="#5c6168" stroke-width="3"/>
  <rect x="592" y="300" width="236" height="300" rx="6" fill="none" stroke="#000" stroke-opacity="0.2" stroke-width="3"/>
</svg>
